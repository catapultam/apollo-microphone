name: Build-Windows
permissions:
  contents: read

# Builds the Windows installer and portable zip. Adapted from the
# ci-windows.yml that commit da5a4e3e removed: build and package steps only.
# The publish job signs a release manifest and puts the installer in a
# prerelease for scripts/updater/ApolloUpdate.ps1. It runs only for the
# branches in PUBLISH_BRANCHES. The "release" environment holds the signing
# key and has the same branch rule.
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - live-resize

jobs:
  build_windows:
    name: Windows-AMD64
    runs-on: windows-2022
    outputs:
      exe_sha256: ${{ steps.exe_hash.outputs.exe_sha256 }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Use a detached HEAD. Then cmake/prep/build_version.cmake adds the
          # short commit sha to the version on all branches, also on master.
          # The updater compares this sha with the release commit.
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Setup Dependencies Windows
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2
        with:
          msystem: ucrt64
          # Use the runner's MSYS2 at C:\msys64, because
          # cmake/targets/common.cmake looks for npm-cli.js at that path
          release: false
          update: true
          install: >-
            wget

      - name: Update Windows dependencies
        env:
          TOOLCHAIN: ucrt-x86_64
        run: |
          dependencies=(
            "git"
            "mingw-w64-${TOOLCHAIN}-cmake"
            "mingw-w64-${TOOLCHAIN}-cppwinrt"
            "mingw-w64-${TOOLCHAIN}-curl-winssl"
            "mingw-w64-${TOOLCHAIN}-gcc"
            "mingw-w64-${TOOLCHAIN}-graphviz"
            "mingw-w64-${TOOLCHAIN}-MinHook"
            "mingw-w64-${TOOLCHAIN}-miniupnpc"
            "mingw-w64-${TOOLCHAIN}-nlohmann-json"
            "mingw-w64-${TOOLCHAIN}-nodejs"
            "mingw-w64-${TOOLCHAIN}-nsis"
            "mingw-w64-${TOOLCHAIN}-onevpl"
            "mingw-w64-${TOOLCHAIN}-openssl"
            "mingw-w64-${TOOLCHAIN}-opus"
            "mingw-w64-${TOOLCHAIN}-toolchain"
          )
          pacman -Syu --noconfirm "${dependencies[@]}"

      - name: Build Windows
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p build
          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTS=OFF \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DSUNSHINE_PUBLISHER_NAME='${{ github.repository_owner }}' \
            -DSUNSHINE_PUBLISHER_WEBSITE='https://github.com/${{ github.repository }}' \
            -DSUNSHINE_PUBLISHER_ISSUE_URL='https://github.com/${{ github.repository }}/issues'
          ninja -C build

      - name: Package Windows
        run: |
          mkdir -p artifacts
          cd build
          cpack -G NSIS
          cpack -G ZIP
          ls -la cpack_artifacts
          mv ./cpack_artifacts/*.exe ../artifacts/
          mv ./cpack_artifacts/*.zip ../artifacts/

      - name: Hash Installer
        id: exe_hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath artifacts/Apollo.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "Apollo.exe SHA-256: $hash"
          "exe_sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: build-Windows-AMD64
          path: artifacts/
          if-no-files-found: error

  publish:
    name: Publish signed release
    needs: build_windows
    # Keep this list the same as the deployment branch rule of the
    # "release" environment.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      contains(fromJSON('["master", "live-resize"]'), github.ref_name)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: build-Windows-AMD64
          path: artifacts

      - name: Write Manifest
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BUILT_SHA256: ${{ needs.build_windows.outputs.exe_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/Apollo.exe release/Apollo.exe
          exe_sha256="$(sha256sum release/Apollo.exe | cut -d' ' -f1)"
          # The artifact must be the file that the build job of this run made.
          if [ -z "${BUILT_SHA256}" ] || [ "${exe_sha256}" != "${BUILT_SHA256}" ]; then
            echo "::error::Apollo.exe SHA-256 ${exe_sha256} is not the build job value '${BUILT_SHA256}'."
            exit 1
          fi
          # ApolloUpdate.ps1 reads these lines. Change both files together.
          {
            echo "format: apollo-update-manifest-1"
            echo "repository: ${GITHUB_REPOSITORY}"
            echo "channel: ${BRANCH}"
            echo "commit: ${GITHUB_SHA}"
            echo "run_id: ${RUN_ID}"
            echo "run_number: ${RUN_NUMBER}"
            echo "run_attempt: ${RUN_ATTEMPT}"
            echo "apollo_exe_sha256: ${exe_sha256}"
          } > release/apollo-update-manifest.txt
          cat release/apollo-update-manifest.txt

      - name: Sign Manifest
        env:
          SIGNING_KEY: ${{ secrets.APOLLO_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY}" ]; then
            echo "::error::The secret APOLLO_UPDATE_SIGNING_KEY of the release environment is empty or missing."
            exit 1
          fi
          cd release
          umask 077
          key_file="${RUNNER_TEMP}/apollo-update-signing.pem"
          printf '%s\n' "${SIGNING_KEY}" > "${key_file}"
          trap 'shred -u "${key_file}" 2>/dev/null || rm -f "${key_file}"' EXIT
          # Fail before the signature step if the key is not a valid key.
          openssl pkey -in "${key_file}" -noout
          # RSA with SHA-256 and PKCS#1 v1.5 padding over the exact file bytes.
          openssl dgst -sha256 -sign "${key_file}" \
            -out apollo-update-manifest.txt.sig apollo-update-manifest.txt
          openssl pkey -in "${key_file}" -pubout -out "${RUNNER_TEMP}/pub.pem"
          openssl dgst -sha256 -verify "${RUNNER_TEMP}/pub.pem" \
            -signature apollo-update-manifest.txt.sig apollo-update-manifest.txt

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          tag="build-${RUN_NUMBER}-${short_sha}"
          if [ "${RUN_ATTEMPT}" != "1" ]; then
            tag="${tag}-a${RUN_ATTEMPT}"
          fi
          # The updater trusts only the signed manifest. These lines are
          # for people and to find candidate releases.
          {
            echo "branch: ${BRANCH}"
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${RUN_ID}"
            echo "run_url: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          } > release-notes.txt
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Apollo ${BRANCH} build ${RUN_NUMBER} (${short_sha})" \
            --notes-file release-notes.txt \
            release/Apollo.exe release/apollo-update-manifest.txt \
            release/apollo-update-manifest.txt.sig
          echo "Created release ${tag}"
